name: standards

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: Lint standards docs (format + 1:1 rule/reference contract)
        run: make lint
      - name: Check the README index is up to date
        run: make index-check
      - name: Build dashboard (re-validates the contract)
        run: make dashboard-build
